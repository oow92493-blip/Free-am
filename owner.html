<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Control Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.65);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7928ca;
            --text-color: #f8fafc;
            --text-dim: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --success-color: #10b981;
            --danger-color: #f43f5e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            min-height: 100vh; 
            padding-bottom: 40px; 
        }

        .bg-glow-1 { 
            position: fixed; top: -120px; left: 50%; transform: translateX(-50%); 
            width: 700px; height: 380px; 
            background: radial-gradient(circle, rgba(121, 40, 202, 0.25) 0%, rgba(0, 242, 254, 0.15) 50%, rgba(0,0,0,0) 75%); 
            pointer-events: none; z-index: -1; filter: blur(40px);
        }

        nav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 1.2rem 1.8rem; background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(20px); 
            border-bottom: 1px solid var(--card-border); sticky: top; z-index: 100; 
        }

        .logo { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--accent-purple); }

        .container { max-width: 720px; margin: 1.5rem auto; padding: 0 1.2rem; }

        .analytics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
        .stat-card { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 18px; padding: 1.2rem 1rem; text-align: center; 
        }
        .stat-card i { font-size: 1.5rem; margin-bottom: 8px; }
        .stat-value { font-size: 1.5rem; font-weight: 700; color: #fff; }
        .stat-label { font-size: 0.72rem; color: var(--text-dim); }

        .card { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            border-radius: 24px; padding: 2rem 1.8rem; margin-bottom: 1.5rem; backdrop-filter: blur(20px);
        }

        .card h2 { font-size: 1.25rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; color: #fff; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--text-dim); font-weight: 600; }

        .input-box { position: relative; display: flex; align-items: center; }
        .input-box i { position: absolute; left: 16px; color: var(--text-dim); }
        .input-box input { 
            width: 100%; padding: 14px 15px 14px 48px; background: rgba(30, 41, 59, 0.5); 
            border: 1px solid var(--border-color); border-radius: 14px; color: #fff; outline: none; 
        }

        .btn-action { 
            width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue)); 
            border: none; border-radius: 14px; color: #fff; font-weight: 700; cursor: pointer; margin-top: 1rem; 
        }

        .user-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.83rem; text-align: left; }
        .user-table th, .user-table td { padding: 10px 12px; border-bottom: 1px solid var(--card-border); }
        .user-table th { color: var(--accent-cyan); font-weight: 600; }

        .btn-stock-edit {
            background: rgba(0, 242, 254, 0.2); color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan); padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 0.75rem;
        }

        .log-list { margin-top: 1rem; max-height: 280px; overflow-y: auto; }
        .log-item { 
            background: rgba(30, 41, 59, 0.4); border: 1px solid var(--card-border); 
            padding: 12px 14px; border-radius: 14px; margin-bottom: 10px; font-size: 0.82rem; 
            display: flex; justify-content: space-between; align-items: center; 
        }

        @media (max-width: 480px) { .analytics-grid { grid-template-columns: repeat(1, 1fr); } }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>

    <nav>
        <div class="logo">
            <i class="fa-solid fa-user-gear"></i>
            <span>Owner Control Panel</span>
        </div>
    </nav>

    <div class="container">

        <!-- ANALYTICS CARDS -->
        <div class="analytics-grid">
            <div class="stat-card">
                <i class="fa-solid fa-users" style="color: var(--accent-cyan);"></i>
                <div class="stat-value" id="stat-total-users">0</div>
                <div class="stat-label">Total User Terdaftar</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-box-open" style="color: var(--accent-blue);"></i>
                <div class="stat-value" id="stat-default-stock">0</div>
                <div class="stat-label">Default Stok Baru</div>
            </div>

            <div class="stat-card">
                <i class="fa-solid fa-circle-check" style="color: var(--success-color);"></i>
                <div class="stat-value" id="stat-success-val">0</div>
                <div class="stat-label">Total Unlock Sukses</div>
            </div>
        </div>

        <!-- MANAJEMEN USER & STOK INDIVIDUAL -->
        <div class="card">
            <h2><i class="fa-solid fa-id-card" style="color: var(--accent-cyan);"></i> Daftar User & Stok Masing-Masing</h2>
            <p style="font-size: 0.82rem; color: var(--text-dim);">Daftar pengguna terdaftar beserta ID & sisa stoknya.</p>

            <div style="overflow-x: auto;">
                <table class="user-table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Stok AM</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- CONFIGURATION FORM -->
        <div class="card">
            <h2><i class="fa-solid fa-sliders" style="color: var(--accent-purple);"></i> Pengaturan Server & Stok Default</h2>
            
            <form id="owner-config-form">
                <div class="form-group">
                    <label>API Key Server</label>
                    <div class="input-box">
                        <i class="fa-solid fa-key"></i>
                        <input type="text" id="cfg-apikey" placeholder="Masukkan API Key..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Default Stok AM untuk User Baru</label>
                    <div class="input-box">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <input type="number" id="cfg-stock" placeholder="Contoh: 5" min="0" required>
                    </div>
                </div>

                <button type="submit" class="btn-action">
                    <i class="fa-solid fa-floppy-disk"></i> Simpan Konfigurasi
                </button>
            </form>
        </div>

        <!-- USER LOGS MONITORING -->
        <div class="card">
            <h2><i class="fa-solid fa-list-check" style="color: var(--accent-cyan);"></i> Log Aktivitas</h2>
            <div class="log-list" id="owner-logs-container"></div>
        </div>

    </div>

    <script>
        function loadOwnerData() {
            document.getElementById('cfg-apikey').value = localStorage.getItem('db_apikey') || '';
            document.getElementById('cfg-stock').value = localStorage.getItem('db_stock') || '5';

            updateDashboardAnalytics();
            renderUsersTable();
            renderOwnerLogs();
        }

        function updateDashboardAnalytics() {
            const logs = JSON.parse(localStorage.getItem('db_user_logs') || '[]');
            const users = JSON.parse(localStorage.getItem('db_users_list') || '[]');
            const defaultStock = localStorage.getItem('db_stock') || '5';

            const successCount = logs.filter(l => l.status.includes('SUKSES')).length;

            document.getElementById('stat-total-users').innerText = users.length;
            document.getElementById('stat-default-stock').innerText = defaultStock;
            document.getElementById('stat-success-val').innerText = successCount;
        }

        function renderUsersTable() {
            const users = JSON.parse(localStorage.getItem('db_users_list') || '[]');
            const tbody = document.getElementById('user-table-body');

            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--text-dim);">Belum ada user mendaftar.</td></tr>`;
                return;
            }

            tbody.innerHTML = users.map(u => `
                <tr>
                    <td style="color:var(--accent-cyan); font-weight:700;">${u.id}</td>
                    <td>${u.username}</td>
                    <td>${u.email}</td>
                    <td style="font-weight:700; color:#fff;">${u.stock}</td>
                    <td>
                        <button class="btn-stock-edit" onclick="editUserStock('${u.id}')">
                            <i class="fa-solid fa-pen"></i> Ubah Stok
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function editUserStock(userId) {
            let users = JSON.parse(localStorage.getItem('db_users_list') || '[]');
            const user = users.find(u => u.id === userId);

            if (user) {
                const newStock = prompt(`Atur jumlah stok AM untuk ID: ${user.id} (${user.username})`, user.stock);
                if (newStock !== null && !isNaN(newStock) && newStock !== '') {
                    user.stock = parseInt(newStock, 10);
                    localStorage.setItem('db_users_list', JSON.stringify(users));

                    // Jika user yang diedit sedang login, update sesinya
                    const currentSession = JSON.parse(localStorage.getItem('current_user_session') || 'null');
                    if (currentSession && currentSession.id === userId) {
                        currentSession.stock = user.stock;
                        localStorage.setItem('current_user_session', JSON.stringify(currentSession));
                    }

                    loadOwnerData();
                    alert(`✅ Stok untuk ID ${userId} berhasil diperbarui menjadi ${newStock}!`);
                }
            }
        }

        function renderOwnerLogs() {
            const logs = JSON.parse(localStorage.getItem('db_user_logs') || '[]');
            const container = document.getElementById('owner-logs-container');

            if (logs.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:var(--text-dim); font-size:0.85rem; padding: 1rem 0;">Belum ada log.</p>`;
                return;
            }

            container.innerHTML = logs.map(item => `
                <div class="log-item">
                    <div>
                        <strong>${item.email}</strong>
                        <span style="color:var(--text-dim); font-size:0.75rem;">${item.detail} • ${item.time}</span>
                    </div>
                    <span style="color:var(--accent-cyan); font-weight:600;">${item.status}</span>
                </div>
            `).join('');
        }

        document.getElementById('owner-config-form').addEventListener('submit', function(e) {
            e.preventDefault();
            localStorage.setItem('db_apikey', document.getElementById('cfg-apikey').value.trim());
            localStorage.setItem('db_stock', document.getElementById('cfg-stock').value.trim());

            updateDashboardAnalytics();
            alert('✅ Konfigurasi Server berhasil disimpan!');
        });

        window.addEventListener('storage', loadOwnerData);
        document.addEventListener('DOMContentLoaded', loadOwnerData);
    </script>
</body>
</html>
